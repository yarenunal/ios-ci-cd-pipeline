name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint

      - name: Select simulator
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available
          ID_PATTERN='[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}'
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 17 Pro \(" | head -n 1 | grep -Eo "$ID_PATTERN" || true)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | grep -Eo "$ID_PATTERN" || true)
          fi
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available on this runner"
            exit 1
          fi
          echo "Using simulator: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and Test
        run: |
          xcodebuild test \
            -project Testing.xcodeproj \
            -scheme Testing \
            -destination "id=$SIM_UDID" \
            -only-testing:TestingTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
